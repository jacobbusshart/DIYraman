name: Build & deploy docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install MkDocs + plugins
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install mkdocs-material mkdocs-callouts
          fi

      - name: Use top-level README as docs home
        run: |
          mkdir -p docs
          cp README.md docs/index.md

      - name: Copy BOM into docs so MkDocs ships it
        run: |
          if [ -f "bom/BOM.md" ]; then
            mkdir -p "docs/bom"
            cp "bom/BOM.md" "docs/bom/BOM.md"
          fi

      - name: Copy assets into docs so MkDocs ships them
        run: |
          if [ -d "assets" ]; then
            mkdir -p docs/assets
            cp -R assets/* docs/assets/ || true
          fi

      - name: Copy results into docs so MkDocs ships them
        run: |
          if [ -d "results" ]; then
            mkdir -p docs/results
            cp -R results/* docs/results/ || true
          fi

      - name: Build & deploy to gh-pages
        run: mkdocs gh-deploy --force

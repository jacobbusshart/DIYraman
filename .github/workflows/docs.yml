name: Build & deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs + plugins
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs mkdocs-material mkdocs-callouts

      - name: Prepare docs (copy folders + fix README links + patch nav)
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, re
          from urllib.parse import urlsplit, urlunsplit

          repo = Path(".").resolve()
          docs_dir = repo / "docs"
          docs_dir.mkdir(exist_ok=True)

          def copy_tree_merge(src: Path, dst: Path):
            if not src.exists():
              return
            dst.mkdir(parents=True, exist_ok=True)
            # copy contents (not the folder itself)
            for item in src.iterdir():
              target = dst / item.name
              if item.is_dir():
                shutil.copytree(item, target, dirs_exist_ok=True)
              else:
                shutil.copy2(item, target)

          # 1) Ensure folders that README might reference exist inside docs/
          copy_tree_merge(repo / "assets",  docs_dir / "assets")
          copy_tree_merge(repo / "results", docs_dir / "results")

          # 2) Copy BOM into docs so it's served by MkDocs
          bom_src = repo / "bom" / "BOM.md"
          if bom_src.exists():
            (docs_dir / "bom").mkdir(parents=True, exist_ok=True)
            shutil.copy2(bom_src, docs_dir / "bom" / "BOM.md")

          # 3) Build a mapping "Filename.md" -> "some/folder/Filename.md" within docs/
          name_to_paths = {}
          for p in docs_dir.rglob("*.md"):
            rel = p.relative_to(docs_dir).as_posix()
            name_to_paths.setdefault(p.name, []).append(rel)

          def unique_path_for_filename(filename: str):
            paths = name_to_paths.get(filename, [])
            if len(paths) == 1:
              return paths[0]
            return None

          # 4) Copy README.md -> docs/index.md and rewrite broken links
          readme = repo / "README.md"
          if readme.exists():
            text = readme.read_text(encoding="utf-8")

            def fix_url(url: str) -> str:
              u = url.strip()

              # Parse fragments like foo.md#section
              parts = urlsplit(u)
              path = parts.path
              frag = parts.fragment
              query = parts.query

              # Normalize GitHub blob/raw links to repo-relative
              path = re.sub(r"^https?://github\.com/jacobbusshart/DIYraman/blob/main/", "", path)
              path = re.sub(r"^https?://raw\.githubusercontent\.com/jacobbusshart/DIYraman/main/", "", path)

              # Force BOM to local page
              if "bom/BOM.md" in path:
                path = "bom/BOM.md"

              # Fix README links that start with docs/... (these 404 on the deployed site)
              for prefix in ("docs/", "./docs/"):
                if path.startswith(prefix):
                  stripped = path[len(prefix):]

                  # If it exists exactly under docs/, use it
                  if (docs_dir / stripped).exists():
                    path = stripped
                    break

                  # If it's a bare filename, map it to its real location inside docs/
                  candidate = unique_path_for_filename(Path(stripped).name)
                  if candidate:
                    path = candidate
                    break

                  # fallback: at least drop the docs/ prefix
                  path = stripped
                  break

              # Rebuild URL
              return urlunsplit((
                parts.scheme, parts.netloc, path, query, frag
              ))

            # Replace markdown links and image links: [text](url) and ![alt](url)
            def repl(m):
              label = m.group(1)
              url = m.group(2)
              return f"[{label}]({fix_url(url)})"

            text = re.sub(r"\[([^\]]+)\]\(([^)]+)\)", repl, text)
            (docs_dir / "index.md").write_text(text, encoding="utf-8")

          # 5) Patch mkdocs.yml so "Parts list (BOM)" is internal (not GitHub)
          mk = repo / "mkdocs.yml"
          if mk.exists():
            t = mk.read_text(encoding="utf-8")

            # Replace explicit GitHub BOM urls with local path
            t = re.sub(
              r"https?://github\.com/jacobbusshart/DIYraman/(blob|tree)/main/bom/BOM\.md",
              "bom/BOM.md",
              t
            )

            # If there's a nav line like: - Parts list (BOM): <something>
            t = re.sub(
              r"(?m)^(\s*-\s*Parts list \(BOM\)\s*:\s*).*$",
              r"\1bom/BOM.md",
              t
            )

            mk.write_text(t, encoding="utf-8")
          PY

      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdocs gh-deploy --force

site_name: DIYraman Documentation
site_url: https://docs.diyraman.com

repo_url: https://github.com/jacobbusshart/DIYraman
repo_name: jacobbusshart/DIYraman
edit_uri: edit/main/docs/

docs_dir: docs


nav:
  - 00 - Start here:
      - Parts list (BOM): https://github.com/jacobbusshart/DIYraman/blob/main/bom/BOM.md
      - Introduction: Introduction.md

  - 01 - Build the basics:
      - Measuring light: "Spectrometer-Setup.md"
      - Dustproof workspace: "Dustproof-Workspace.md"
      - Core assembly: "Core-Assembly.md"

  - 02 - Calibrate & test:
      - Aligning with fluorescence: "Align-with-Fluorescence.md"
      - Software quick guide: "SpectrumStudio-Cheatsheet.md"

  - 03 - Upgrades:
      - DIY focus stage: "DIY-Linear-Stage.md"
      - Full build: "Full-Build.md"

theme:
  name: material
  language: en

  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.tracking
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight

  palette:
    - scheme: slate
      primary: black
      accent: red

  font:
    text: KoHo
    code: JetBrains Mono

plugins:
  - search
  - callouts

markdown_extensions:
  - nl2br
  - admonition
  - toc:
      permalink: "#"
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      
extra_css:
  - extra.css